[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auditui"
version = "0.2.0"
description = "An Audible TUI client"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "GPL-3.0-or-later"
authors = [{ name = "Kharec" }]
keywords = ["audible", "audiobook", "tui", "terminal"]
classifiers = [
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = ["audible>=0.10.0", "httpx>=0.28.1", "textual>=8.0.0"]

[project.urls]
Repository = "https://github.com/Kharec/auditui"
Issues = "https://github.com/Kharec/auditui/issues"

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.0",
  "pytest>=7.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.28.1",
]

[project.scripts]
auditui = "auditui.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["auditui"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.uv]
package = true
